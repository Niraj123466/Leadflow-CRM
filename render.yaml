services:
  - type: web
    name: leadflow-backend
    runtime: docker
    rootDirectory: backend
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_TIMEZONE
        value: UTC
      - key: CORS_ORIGINS
        value: "https://frontend-omega-bice-d05rsgtqm1.vercel.app"
      - key: DISCUSSION_DEDUP_WINDOW_SECONDS
        value: "90"
    healthCheckPath: /health
    autoDeploy: true
